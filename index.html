<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PS5 Jailbreak Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    user-select:none; -webkit-user-select:none;
    background-color:#0c0c0f; color:#fff; font-family:Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; margin:0; padding:16px; box-sizing:border-box;
}
#cat { 
    width:240px; max-width:66vw; border-radius:12px; margin-bottom:20px;
    box-shadow:0 0 0 2px #2a2a2e, 0 0 22px 4px #2a2a2e; object-fit: cover;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
}
#cat.run { animation: pulse 1.1s ease-in-out infinite; }
#cat.ok {
    border-color: #16c60c;
    box-shadow: 0 0 0 2px #16c60c, 0 0 40px 10px rgba(22,198,12,0.75);
    animation: escapeSandbox 1.5s ease-out forwards;
}
#cat.failed { border-color: #e74856; box-shadow: 0 0 0 2px #e74856, 0 0 34px 8px rgba(231,72,86,0.6); animation: none; }
@keyframes pulse {
    0%,100% { box-shadow: 0 0 0 2px #35507a, 0 0 16px 3px rgba(53,80,122,0.5); }
    50%     { box-shadow: 0 0 0 2px #4f7fd6, 0 0 30px 8px rgba(79,127,214,0.7); }
}
@keyframes escapeSandbox {
    0% { transform: scale(1) translateY(0) rotate(0deg); }
    20% { transform: scale(1.1) translateY(-10px) rotate(-2deg); }
    40% { transform: scale(1.05) translateY(-5px) rotate(2deg); }
    60% { transform: scale(1.2) translateY(-20px) rotate(-5deg); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 40px 10px rgba(22,198,12,0.75); }
    80% { transform: scale(1.3) translateY(-30px) rotate(3deg); box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 50px 15px rgba(22,198,12,0.9); z-index: 100; position: relative; }
    100% { transform: scale(1) translateY(0) rotate(0deg); z-index: 100; position: relative; }
}
.info-card {
    background: #16161e; border: 1px solid #2a2a35; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 20px; width: 100%; max-width: 300px;
    display: none;
}
.info-row {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    font-size: 0.82rem; color: #8a8a9e;
}
.info-row:last-child { margin-bottom: 0; }
.info-val { color: #00e676; font-family: monospace; font-weight: bold; }
.info-val.editable { cursor: pointer; border-bottom: 1px dotted #00e676; transition: opacity 0.2s; }
.info-val.editable:hover { opacity: 0.8; color: #66ffa6; }
.preset-row {
    display: flex; gap: 4px; margin-top: 8px; justify-content: space-between;
}
.preset-pill {
    background: #20212f; border: 1px solid #3a3a4d; color: #00e5ff;
    font-size: 0.68rem; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    font-weight: bold; transition: all 0.2s ease;
}
.preset-pill:hover, .preset-pill.active {
    background: #00e5ff; color: #121216; border-color: #00e5ff;
}
.btn {
    padding:1rem 2rem; text-align:center; cursor:pointer;
    min-width:12rem; border-radius:1.25rem; background-color:#202125;
    border:none; color:#fff; font-size:1.5rem; font-weight:800;
    transition:background-color 0.25s ease; text-decoration: none; display: inline-block;
}
.btn:hover:not(.disabled) { background-color:#a2a2a6; color:#202020; }
.btn.disabled { opacity:0.4; pointer-events:none; }
.btn.secondary { background-color:#1a1a2e; }
.btn.secondary:hover:not(.disabled) { background-color:#4f7fd6; color:#fff; }
.btn.running { background: linear-gradient(90deg, #1a1a2e, #2a2a3e); animation: btnPulse 1.5s ease-in-out infinite; }
@keyframes btnPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(79,127,214,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(79,127,214,0); }
}
#msg { color:#888; font-size:0.8rem; margin-top:14px; min-height:1.2em; text-align: center; }
#progress { color:#00e5ff; font-size:0.75rem; margin-top:8px; min-height:1.2em; text-align: center; font-family: monospace; }
.btn-group { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
    background: #16161e; border: 1px solid #2a2a35; border-radius: 16px;
    padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h2 { color: #00e5ff; margin: 0 0 16px; text-align: center; font-size: 1.5rem; }
.payload-list { display: flex; flex-direction: column; gap: 10px; }
.payload-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: #20212f; border: 1px solid #3a3a4d; border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease;
}
.payload-item:hover { background: #2a2b3d; border-color: #4f7fd6; }
.payload-item.disabled { opacity: 0.5; pointer-events: none; }
.payload-icon { font-size: 1.8rem; width: 48px; text-align: center; }
.payload-info { flex: 1; }
.payload-name { color: #fff; font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
.payload-desc { color: #8a8a9e; font-size: 0.85rem; }
.payload-btn {
    padding: 8px 16px; background: #00e5ff; color: #121216; border: none;
    border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    transition: background 0.2s;
}
.payload-btn:hover { background: #66ffb3; }
.payload-btn.sending { background: #ffab00; cursor: wait; }
.payload-btn.disabled { opacity: 0.4; cursor: not-allowed; }
.close-modal {
    width: 100%; margin-top: 16px; padding: 12px; background: #2a2a35;
    color: #fff; border: 1px solid #4f7fd6; border-radius: 8px;
    font-weight: 700; cursor: pointer; font-size: 1rem;
}
.close-modal:hover { background: #4f7fd6; }
.stage-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
    margin-left: 8px; vertical-align: middle;
}
.stage-badge.webkit { background: #4f7fd6; color: #fff; }
.stage-badge.elfldr { background: #00e5ff; color: #121216; }
.stage-badge.kernel { background: #ffab00; color: #121216; }
.stage-badge.verify { background: #c084fc; color: #121216; }
.stage-badge.complete { background: #16c60c; color: #121216; }
.stage-badge.failed { background: #e74856; color: #fff; }
.stage-badge.idle { background: #3a3a4d; color: #8a8a9e; }
</style>
</head>
<body>

<img id="cat" src="purple-dragon-bjdfl14c25o2xcs7.jpg" alt="PS5 Jailbreak">

<div class="info-card" id="info-card">
    <div class="info-row">
        <span>Target Host:</span>
        <span class="info-val editable" id="ip-val" title="Click to edit LAN IP">Detecting...</span>
    </div>
    <div class="info-row">
        <span>Payload Port:</span>
        <span class="info-val editable" id="port-val" title="Click to edit Port">9026</span>
    </div>
</div>

<div class="btn-group">
    <a tabindex="0" class="btn disabled" id="jailbreak">JAILBREAK <span class="stage-badge idle" id="jailbreak-stage">IDLE</span></a>
    <a tabindex="0" class="btn secondary disabled" id="payloads-btn">PAYLOADS</a>
</div>
<div id="msg"></div>
<div id="progress"></div>

<div class="modal-overlay" id="payload-modal">
    <div class="modal">
        <h2>Built-in Payloads <span class="stage-badge" id="payloads-status">LOCKED</span></h2>
        <div class="payload-list" id="payload-list"></div>
        <button class="close-modal" id="close-modal">Close</button>
    </div>
</div>

<script>
"use strict";
const OFFSETS_URL = "offsets/offsets.json";
const DEFAULT_LISTENER_PORT = "9026";

const jailbreak = document.getElementById("jailbreak");
const payloadsBtn = document.getElementById("payloads-btn");
const msg = document.getElementById("msg");
const progress = document.getElementById("progress");
const ipVal = document.getElementById("ip-val");
const portVal = document.getElementById("port-val");
const payloadModal = document.getElementById("payload-modal");
const payloadList = document.getElementById("payload-list");
const closeModal = document.getElementById("close-modal");
const jailbreakStage = document.getElementById("jailbreak-stage");
const payloadsStatus = document.getElementById("payloads-status");
const cat = document.getElementById("cat");

const BUILTIN_PAYLOADS = [
    { file: "kstuff.elf", name: "Kstuff (Kernel Exploit)", desc: "Kernel exploit up to 13.60 — fpkg, homebrew, debug", icon: "🔓", color: "#16c60c", port: 9020 },
    { file: "elfldr-ps5-1360.elf", name: "ELF Loader", desc: "Load custom ELF payloads from USB/host", icon: "📦", color: "#00e5ff", port: 9026 },
    { file: "ftpsrv-ps5.elf", name: "FTP Server", desc: "File transfer over network (port 2121)", icon: "📁", color: "#ffab00", port: 2121 },
    { file: "websrv-ps5.elf", name: "Web Server", desc: "HTTP file browser on PS5", icon: "🌐", color: "#4f7fd6", port: 8080 },
    { file: "shsrv-ps5.elf", name: "Shell Server", desc: "Remote shell access via netcat", icon: "💻", color: "#ff6b6b", port: 9022 },
    { file: "gdbsrv-ps5.elf", name: "GDB Server", desc: "Kernel/userspace debugging via GDB", icon: "🐛", color: "#c084fc", port: 9023 },
    { file: "klogsrv-ps5.elf", name: "Kernel Log Server", desc: "Capture kernel dmesg/logs over network", icon: "📋", color: "#8b5cf6", port: 9024 },
    { file: "hello_world.elf", name: "Hello World", desc: "Test payload — shows notification", icon: "👋", color: "#66ffa6", port: 9026 },
    { file: "PLK.elf", name: "PLK (PS5Link)", desc: "PS5Link server for app debugging", icon: "🔗", color: "#f472b6", port: 9025 },
    { file: "shadowmountplus.elf", name: "ShadowMount+", desc: "Mount games/backups from USB/network", icon: "💾", color: "#fbbf24", port: 9027 },
];

function isIPv4(str) {
    if (!str || typeof str !== "string") return false;
    const parts = str.split(".");
    if (parts.length !== 4) return false;
    return parts.every(p => {
        const n = parseInt(p, 10);
        return !isNaN(n) && n >= 0 && n <= 255 && String(n) === p;
    });
}

function isPrivateLanIP(ip) {
    if (!isIPv4(ip)) return false;
    if (ip.startsWith("127.") || ip.startsWith("0.")) return false;
    return (
        ip.startsWith("192.168.") ||
        ip.startsWith("10.") ||
        /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(ip) ||
        ip.startsWith("169.254.")
    );
}

function decodeMDNSSuffix(candidateStr) {
    const m = /([0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\.local/i.exec(candidateStr);
    if (m && m[1]) {
        const hex = m[1];
        const p1 = parseInt(hex.substr(0, 2), 16);
        const p2 = parseInt(hex.substr(2, 2), 16);
        const p3 = parseInt(hex.substr(4, 2), 16);
        const p4 = parseInt(hex.substr(6, 2), 16);
        const ip = `${p1}.${p2}.${p3}.${p4}`;
        if (isPrivateLanIP(ip)) return ip;
    }
    return null;
}

let listenerPort = DEFAULT_LISTENER_PORT;
let targetHost = "192.168.X.X";
let isJailbroken = false;

const Q_PARAMS = new URLSearchParams(window.location.search);
const qIp = Q_PARAMS.get("ip") || Q_PARAMS.get("host");
const qPort = Q_PARAMS.get("port");

if (qPort && /^\d+$/.test(qPort)) {
    listenerPort = qPort;
}

let hasExplicitIp = false;
if (qIp && (isIPv4(qIp) || isPrivateLanIP(qIp))) {
    targetHost = qIp;
    hasExplicitIp = true;
} else {
    let savedIp = null;
    try { savedIp = localStorage.getItem("ps5_target_ip"); } catch (e) {}
    if (savedIp && isIPv4(savedIp)) {
        targetHost = savedIp;
        hasExplicitIp = true;
    } else if (isIPv4(window.location.hostname)) {
        targetHost = window.location.hostname;
        hasExplicitIp = true;
    }
}

function updateHostDisplay() {
    if (ipVal) {
        if (targetHost && !targetHost.includes(".github.io") && targetHost !== "Detecting...") {
            ipVal.textContent = targetHost;
        } else {
            ipVal.textContent = "192.168.X.X";
        }
    }
    if (portVal) portVal.textContent = listenerPort;
}

updateHostDisplay();

(function detectLocalIP() {
    try {
        const PeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
        if (!PeerConnection) return;

        const pc = new PeerConnection({
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        });

        if (typeof pc.createDataChannel === "function") {
            pc.createDataChannel("lan_check");
        }

        const processCandidate = (c) => {
            if (!c) return;
            const rawMatch = /([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})/.exec(c);
            if (rawMatch && rawMatch[1] && isPrivateLanIP(rawMatch[1])) {
                targetHost = rawMatch[1];
                updateHostDisplay();
                try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
                return;
            }
            const mdnsIP = decodeMDNSSuffix(c);
            if (mdnsIP) {
                targetHost = mdnsIP;
                updateHostDisplay();
                try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
            }
        };

        pc.onicecandidate = (e) => {
            if (e && e.candidate && e.candidate.candidate) {
                processCandidate(e.candidate.candidate);
            }
        };

        pc.createOffer().then(sdp => {
            if (sdp && sdp.sdp) {
                sdp.sdp.split("\r\n").forEach(processCandidate);
            }
            return pc.setLocalDescription(sdp);
        }).catch(() => {});
    } catch (err) {}
})();

if (ipVal) {
    ipVal.addEventListener("click", function() {
        const val = prompt("Enter PS5 / Target Host LAN IP:", targetHost);
        if (val !== null) {
            const trimmed = val.trim();
            if (trimmed) {
                targetHost = trimmed;
                updateHostDisplay();
                try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
            }
        }
    });
}

if (portVal) {
    portVal.addEventListener("click", function() {
        const val = prompt("Enter Payload Port:", listenerPort);
        if (val !== null) {
            const trimmed = val.trim();
            if (trimmed) {
                listenerPort = trimmed;
                updateHostDisplay();
                try { localStorage.setItem("ps5_payload_port", listenerPort); } catch (e) {}
            }
        }
    });
}

const m = /PlayStation 5[\s\/;](\d+)\.(\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;

let entry = null;

function fwNum(s) {
    const p = s.split(".");
    return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
}

function nearest(data, target) {
    const want = fwNum(target);
    const maj = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data) {
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd) { bestd = d; best = k; }
    }
    return best;
}

fetch(OFFSETS_URL, { cache: "no-store" })
    .then(function (r) { 
        if (!r.ok) return fetch("offsets.json", { cache: "no-store" });
        return r;
    })
    .then(function (res) {
        if (!res.ok) throw new Error("offsets fetch failed");
        return res.json();
    })
    .then(function (data) {
        if (!fw) {
            msg.innerHTML = `Demo mode (<b style="color: #ffffff; font-weight: bold;">Standard Browser</b>)`;
            const keys = Object.keys(data);
            if (keys.length > 0) {
                entry = data[keys[0]];
            } else {
                entry = { hc: ["0x1e0d8", "0x1e320", "0x1f368"], gd: "0x1d11a", nt: "0x4740", gps: "0x34f57b8", gpe: "0x1b280", cls: "0x34f57a8", cle: "0x26e70", ers: "0x34f57b0", ere: "0xf340" };
            }
            jailbreak.classList.remove("disabled");
            renderPayloadList();
            return;
        }

        entry = data[fw];
        if (entry) {
            msg.innerHTML = `firmware <b style="color: #ffffff; font-weight: bold;">${fw}</b> detected & supported`;
            jailbreak.classList.remove("disabled");
            renderPayloadList();
            return;
        }

        const near = nearest(data, fw);
        if (near) {
            entry = data[near];
            msg.innerHTML = `<b style="color: #ffffff; font-weight: bold;">${fw}</b>: no exact offsets, trying <b style="color: #ffffff; font-weight: bold;">${near}</b> (unverified)`;
            jailbreak.classList.remove("disabled");
            renderPayloadList();
        } else {
            msg.innerHTML = `firmware <b style="color: #ffffff; font-weight: bold;">${fw}</b> not supported`;
        }
    })
    .catch(function () {
        msg.textContent = "failed to load offsets (demo fallback active)";
        entry = { hc: ["0x1e0d8", "0x1e320", "0x1f368"], gd: "0x1d11a", nt: "0x4740", gps: "0x34f57b8", gpe: "0x1b280", cls: "0x34f57a8", cle: "0x26e70", ers: "0x34f57b0", ere: "0xf340" };
        jailbreak.classList.remove("disabled");
        renderPayloadList();
    });

function renderPayloadList() {
    payloadList.innerHTML = "";
    BUILTIN_PAYLOADS.forEach(p => {
        const item = document.createElement("div");
        item.className = "payload-item" + (isJailbroken ? "" : " disabled");
        item.innerHTML = `
            <span class="payload-icon" style="color: ${p.color}">${p.icon}</span>
            <div class="payload-info">
                <div class="payload-name">${p.name}</div>
                <div class="payload-desc">${p.desc}</div>
            </div>
            <button class="payload-btn" data-file="${p.file}" data-port="${p.port}" ${isJailbroken ? "" : "disabled"}>SEND</button>
        `;
        const btn = item.querySelector(".payload-btn");
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (isJailbroken) sendPayload(p.file, p.port, btn);
        });
        payloadList.appendChild(item);
    });
}

function updatePayloadsUI() {
    if (isJailbroken) {
        payloadsBtn.classList.remove("disabled");
        payloadsStatus.textContent = "READY";
        payloadsStatus.className = "stage-badge complete";
        document.querySelectorAll(".payload-item").forEach(item => item.classList.remove("disabled"));
        document.querySelectorAll(".payload-btn").forEach(btn => btn.disabled = false);
    } else {
        payloadsBtn.classList.add("disabled");
        payloadsStatus.textContent = "LOCKED";
        payloadsStatus.className = "stage-badge idle";
        document.querySelectorAll(".payload-item").forEach(item => item.classList.add("disabled"));
        document.querySelectorAll(".payload-btn").forEach(btn => btn.disabled = true);
    }
}

function updateStageBadge(stage) {
    const stages = {
        "idle": "IDLE",
        "webkit_uaf": "WEBKIT UAF",
        "elfldr_load": "ELFLDR LOAD",
        "kernel_exploit": "KERNEL EXPLOIT",
        "verify": "VERIFYING",
        "complete": "JAILBROKEN",
        "failed": "FAILED"
    };
    jailbreakStage.textContent = stages[stage] || stage.toUpperCase();
    jailbreakStage.className = "stage-badge " + stage;
}

async function runJailbreak() {
    if (isJailbroken) {
        msg.textContent = "Already jailbroken!";
        return;
    }

    if (!entry) {
        msg.textContent = "Offsets not loaded yet.";
        return;
    }

    const hc = Array.isArray(entry.hc) ? entry.hc.join(",") : entry.hc;
    const params = new URLSearchParams();
    params.set("go", "1");
    params.set("auto", "1");
    params.set("production", "1");
    params.set("trigger", "netcontrol");
    params.set("attempts", "8");
    params.set("only", "ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5");
    params.set("log", "debug");
    params.set("payload", "1");
    params.set("v", "final");
    if (hc) params.set("hc", hc);

    cat.className = "run";
    msg.textContent = "Launching exploit... (page will navigate to exploit)";
    progress.textContent = "";
    updateStageBadge("webkit_uaf");

    setTimeout(() => {
        location.href = `slopkit-main/slopkit/poops.html?${params.toString()}`;
    }, 500);
}

jailbreak.addEventListener("click", runJailbreak);

async function sendPayload(payloadFile, payloadPort, btn) {
    btn.classList.add("sending");
    btn.textContent = "SENDING...";
    try {
        const res = await fetch(`payloads/${payloadFile}`);
        if (!res.ok) throw new Error(`File not found: ${payloadFile}`);
        const data = await res.arrayBuffer();
        msg.textContent = `Sending ${payloadFile} to ${targetHost}:${payloadPort}...`;
        await fetch(`http://${targetHost}:${payloadPort}`, {
            method: "POST",
            mode: "no-cors",
            body: data
        });
        msg.textContent = `Payload sent! Check PS5.`;
        btn.textContent = "SENT!";
        btn.style.background = "#16c60c";
        setTimeout(() => {
            btn.classList.remove("sending");
            btn.textContent = "SEND";
            btn.style.background = "";
        }, 2000);
    } catch (err) {
        msg.textContent = `Error: ${err.message}`;
        btn.textContent = "FAILED";
        btn.style.background = "#e74856";
        setTimeout(() => {
            btn.classList.remove("sending");
            btn.textContent = "SEND";
            btn.style.background = "";
        }, 3000);
    }
}

payloadsBtn.addEventListener("click", function () {
    if (!isJailbroken) {
        msg.textContent = "Jailbreak required first!";
        return;
    }
    payloadModal.classList.add("open");
});

closeModal.addEventListener("click", function () {
    payloadModal.classList.remove("open");
});

payloadModal.addEventListener("click", function (e) {
    if (e.target === payloadModal) {
        payloadModal.classList.remove("open");
    }
});

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && payloadModal.classList.contains("open")) {
        payloadModal.classList.remove("open");
    }
});

try {
    if (localStorage.getItem("ps5_jailbroken") === "1") {
        isJailbroken = true;
        cat.className = "ok";
        jailbreak.textContent = "JAILBROKEN";
        jailbreak.classList.add("disabled");
        msg.textContent = "Previously jailbroken (persisted). Click PAYLOADS.";
        updateStageBadge("complete");
        updatePayloadsUI();
    }
} catch (e) {}
</script>
